<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOB Simulator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Limit Order Book Simulator</h1>

    <section class="grid">

      <!-- ORDER INPUT -->
      <article>
        <h2>Order Input</h2>
        <form id="order-form">
          <input name="id" type="number" placeholder="Order ID" required />
          <select name="side">
            <option value="BUY">Buy</option>
            <option value="SELL">Sell</option>
          </select>
          <select name="orderType">
            <option value="LIMIT">Limit</option>
            <option value="MARKET">Market</option>
          </select>
          <input name="price" type="number" step="0.01" placeholder="Price" />
          <input name="quantity" type="number" placeholder="Quantity" required />
          <button type="submit">Place Order</button>
        </form>

        <div id="queue-info" style="margin-top:10px; font-size:14px;"></div>
        
        <form id="cancel-form">
          <input name="orderId" type="number" placeholder="Order ID to cancel" required />
          <button type="submit">Cancel Order</button>
        </form>
      </article>
      
      <!-- ORDER BOOK -->
      <article>
        <h2>Live Order Book</h2>
        <div id="obi-box" style="
          margin-bottom: 10px;
          padding: 8px;
          border-radius: 6px;
          font-weight: bold;
          text-align: center;
        ">
          OBI: 0.00
        </div>
        <div class="book">

          <!-- BIDS -->
          <div>
            <h3>Bids</h3>
            <table id="bids-table">
              <thead>
                <tr>
                  <th>Price</th>
                  <th>Qty</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <!-- ASKS -->
          <div>
            <h3>Asks</h3>
            <table id="asks-table">
              <thead>
                <tr>
                  <th>Price</th>
                  <th>Qty</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

        </div>
      </article>

      <!-- TRADES -->
      <article>
        <h2>Recent Trades</h2>
        <table id="trades-table">
          <thead>
            <tr>
              <th>Price</th>
              <th>Qty</th>
              <th>Time</th>
              <th>Side</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </article>

    </section>
  </main>

  <script type="module" src="/ui.js"></script>
</body>
</html>
